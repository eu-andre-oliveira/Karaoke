# Se houver outro proxy com TLS na frente (Traefik, Caddy, nginx do host),
# ele manda X-Forwarded-Proto; senão usamos o esquema da própria conexão.
map $http_x_forwarded_proto $proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API REST + Swagger
    location ~ ^/(api|swagger)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # SignalR (WebSocket)
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota devolve o index.html (React Router cuida do resto)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
